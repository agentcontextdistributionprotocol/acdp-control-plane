# E2E-only registry-b config. Same shape as registry-a; different
# authority/port/sqlite path. See ./registry-a.toml for rationale.

[registry]
authority = "registry-b.playground.local"
port      = 8200
bind      = "0.0.0.0"
profiles  = ["acdp-registry-core", "acdp-registry-discovery"]
cross_registry_resolution = true

[registry.tls]
enabled = false

[registry.cors]
allowed_origins = []

[storage]
backend         = "sqlite"
sqlite_path     = "/app/data/registry-b.db"
max_connections = 10

[auth]
enabled                = true
# did:key: the playground's agents publish as did:key (ACDP 0.2.0, verified
# offline from the DID itself) — without it every publish 400s with
# "agent_id method 'did:key' is not in this registry's supported_did_methods".
did_methods            = ["did:web", "did:key"]
anonymous_public_reads = true
token_ttl_seconds      = 3600
challenge_ttl_seconds  = 300
token_leeway_seconds   = 30
jwt_secret             = "cGxheWdyb3VuZC1zZWNyZXQtMzItYnl0ZXMtb2YtdGVzdC1qd3Q="

[webhook]
enabled         = true
url             = "http://playground:8000/webhooks/acdp"
secret          = "playground-dev-secret"
timeout_seconds = 5
max_retries     = 3
queue_capacity  = 1024

[limits]
max_payload_bytes           = 1048576
max_embedded_bytes          = 65536
idempotency_key_ttl_seconds = 86400

[playground]
enabled = true
