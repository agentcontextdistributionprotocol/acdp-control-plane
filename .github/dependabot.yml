version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # typescript majors track the compiler ahead of the lint toolchain:
      # @typescript-eslint caps `typescript` at <6.1.0, so a TS 7 bump can't
      # resolve (npm ci ERESOLVE). Stay on 5.x majors until typescript-eslint
      # supports a newer major, then lift this. Minor/patch still flow.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    # Pattern groups stay (they collapse their own churn); the two
    # update-type groups catch everything else. Dependabot assigns a dep
    # to the first matching group, so the specific patterns are listed
    # before the catch-all minor/major split.
    groups:
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      nestjs:
        patterns:
          - "@nestjs/*"
      drizzle:
        patterns:
          - drizzle-orm
          - drizzle-kit
      # The acdp SDK (NAPI binding over acdp-rs) — declared once, under the
      # `acdp` npm: alias every source import uses (see CP-1). Dependabot
      # itself never proposes updates for this dep; the real automated bump
      # path is bump-acdp.yml's repository_dispatch listener, this group
      # only catches Dependabot's own monthly-safety-net scan of it.
      acdp-sdk:
        patterns:
          - acdp
      minor-and-patch:
        update-types: [minor, patch]
      major-updates:
        update-types: [major]
  # Node runtime pin (node:22-bookworm-slim in the Dockerfile).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
