version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Pattern groups stay (they collapse their own churn); the two
    # update-type groups catch everything else. Dependabot assigns a dep
    # to the first matching group, so the specific patterns are listed
    # before the catch-all minor/major split.
    groups:
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      nestjs:
        patterns:
          - "@nestjs/*"
      drizzle:
        patterns:
          - drizzle-orm
          - drizzle-kit
      # The acdp SDK (NAPI binding over acdp-rs) — keep the real name and
      # the `acdp:` npm-alias (package.json declares both) in one PR.
      acdp-sdk:
        patterns:
          - "@agentcontextdistributionprotocol/acdp"
          - acdp
      minor-and-patch:
        update-types: [minor, patch]
      major-updates:
        update-types: [major]
  # Node runtime pin (node:22-bookworm-slim in the Dockerfile).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
