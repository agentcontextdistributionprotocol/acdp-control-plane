version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Group all otel updates into a single PR so the 0.218 → 0.220 churn
    # doesn't fan out into 7 separate PRs per minor bump.
    groups:
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      nestjs:
        patterns:
          - "@nestjs/*"
      drizzle:
        patterns:
          - drizzle-orm
          - drizzle-kit
      # The acdp SDK (NAPI binding over acdp-rs) ships crypto/SSRF/DID +
      # receipt/log verification — keep the real name and the `acdp:` npm-alias
      # (package.json declares both) in one PR so they never diverge.
      acdp-sdk:
        patterns:
          - "@agentcontextdistributionprotocol/acdp"
          - acdp
  # Node runtime pin (node:22-bookworm-slim in the Dockerfile). Bumps the base
  # image; CI's `docker build (no push)` job gates the PR.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
