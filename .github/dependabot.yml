version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # typescript majors track the compiler ahead of the lint toolchain:
      # @typescript-eslint caps `typescript` at <6.1.0, so a TS 7 bump can't
      # resolve (npm ci ERESOLVE). Stay on 6.x majors until typescript-eslint
      # supports a newer major, then lift this. Minor/patch still flow.
      # (Said "5.x" until issue #137 Phase 8 moved the repo to TypeScript 6.)
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    # Pattern groups stay (they collapse their own churn); the two
    # update-type groups catch everything else. Dependabot assigns a dep
    # to the first matching group, so the specific patterns are listed
    # before the catch-all minor/major split.
    groups:
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      nestjs:
        patterns:
          - "@nestjs/*"
      drizzle:
        patterns:
          - drizzle-orm
          - drizzle-kit
      # The acdp SDK (NAPI binding over acdp-rs). The pattern must be the
      # LITERAL key package.json declares the dependency under, which since
      # commit a5957bd is the scoped name below; this group's former short
      # `acdp` pattern stopped matching it, and a pattern that does not match
      # silently drops the dep into the minor-and-patch / major-updates
      # catch-alls instead of its own group. Dependabot itself rarely proposes
      # updates for this dep; the real automated bump path is bump-acdp.yml's
      # repository_dispatch listener, and this group only catches Dependabot's
      # own monthly-safety-net scan of it.
      acdp-sdk:
        patterns:
          - '@agentcontextdistributionprotocol/acdp'
      minor-and-patch:
        update-types: [minor, patch]
      major-updates:
        update-types: [major]
  # Node runtime pin (node:26-bookworm-slim in the Dockerfile).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
