name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded pushes to the same PR cancel the in-flight run; pushes to main
# always run to completion so every merge commit has a full CI record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: lint + tsc + jest (unit, coverage-gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check out the ACDP spec (pinned)
        # Pinned so a spec-repo push cannot change this repo's CI result
        # without a commit here. The wit-001..004 / log-001 / log-003 golden
        # parity specs (cosign.spec.ts, log-verify.parity.spec.ts) need this
        # checkout — see CP-7. Bump deliberately when adopting new fixtures.
        # (spec main HEAD as of 2026-08-28)
        uses: actions/checkout@v5
        with:
          repository: agentcontextdistributionprotocol/agentcontextdistributionprotocol
          ref: bff3cf3afbdcea619834916e8f0bcac7e82ba658
          path: acdp-spec
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Convention greps (CLAUDE.md CI grep rules)
        run: bash scripts/ci-conventions.sh
      - name: Lint (ESLint)
        run: npm run lint -- --max-warnings 0
      - name: TypeScript compile
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests (coverage thresholds enforced from package.json)
        # ACDP_REQUIRE_CONFORMANCE fails the wit-*/log-* golden-parity specs
        # loudly if the pinned spec checkout above is ever missing, instead
        # of silently `describe.skip`-ing them (the CP-7 fix — this suite was
        # skipping unnoticed on every CI run before this).
        run: npx jest --testPathIgnorePatterns='/test/integration/' --ci --coverage
        env:
          NODE_ENV: test
          ACDP_SPEC_DIR: ${{ github.workspace }}/acdp-spec
          ACDP_REQUIRE_CONFORMANCE: '1'
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  integration:
    name: jest integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acdp_control_plane_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5433/acdp_control_plane_test
      NODE_ENV: test
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Integration tests
        run: npm run test:integration

  docker:
    # The release workflow builds this same Dockerfile on tag push — catching a
    # broken build here (PR time) instead of at release time. push: false, so
    # nothing is published; the gha cache is shared with release builds.
    name: docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
