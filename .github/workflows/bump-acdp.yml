name: bump acdp
on:
  repository_dispatch:
    types: [acdp-released]
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact acdp version (blank = latest / event payload)'
        required: false
        default: ''
jobs:
  bump:
    uses: agentcontextdistributionprotocol/acdp-ci/.github/workflows/bump-consume.yml@v1
    with:
      ecosystem: npm
      # `package` is the npm REGISTRY name (bump-consume.yml resolves/waits on
      # it via `npm view`), independent of whatever manifest key the local
      # package.json happens to declare it under. bump-consume.yml's rewrite
      # step matches a manifest key equal to `package` directly — pointing
      # this at anything but the real scoped name breaks every step (`npm
      # view` 404s on an unpublished name).
      package: '@agentcontextdistributionprotocol/acdp'
      version: ${{ github.event.inputs.version }}
    secrets: inherit
