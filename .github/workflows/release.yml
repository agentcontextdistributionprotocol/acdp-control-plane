name: Release

# Build the control-plane image and publish it to GitHub Container Registry
# (GHCR) on every version tag (e.g. `v0.1.0`), then trigger a Railway redeploy
# of the service that tracks the GHCR image.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The docker/* actions below still ship Node.js 20 entrypoints at their current
# majors. GitHub forces those to Node.js 24 on 2026-06-16 and removes Node.js 20
# from runners on 2026-09-16. Opt in early so the workflow is exercised on Node 24
# before it becomes mandatory; this env var is a harmless no-op once Node 24 is
# the runner default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  image:
    name: build + push (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy (Railway)
    needs: image
    runs-on: ubuntu-latest
    # Turn on by setting repo variable DEPLOY_TO_RAILWAY=true (and secret
    # RAILWAY_TOKEN + variable RAILWAY_SERVICE). Until then the image still
    # publishes; this job is skipped.
    if: ${{ vars.DEPLOY_TO_RAILWAY == 'true' }}
    steps:
      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Redeploy service (pulls latest GHCR image)
        run: railway redeploy --service "$RAILWAY_SERVICE" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
