name: Dependabot auto-merge

# Enables GitHub's native auto-merge on Dependabot PRs. The merge only fires
# once branch-protection's required status checks pass (the CI workflow's
# unit / integration / docker jobs) — this job just arms it, it does not
# bypass CI. Major-version bumps are intentionally left for manual review.
#
# Requires (one-time, in repo settings — cannot be set from a workflow file):
#   1. Settings → General → "Allow auto-merge" enabled.
#   2. Branch protection on `main` with the CI jobs marked as required checks.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (patch + minor only)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
